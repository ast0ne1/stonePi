# Include from stonepi.conf (always). Dashboard scrapes display JSON over loopback.
# Keeps /api/display off the public edge whether exposure is lan or public.

location = /news/api/display { return 404; }
location = /events/api/display { return 404; }
location = /pinboard/api/display { return 404; }
location = /auth/api/display { return 404; }
location = /studio/api/display { return 404; }
location = /prices/api/display { return 404; }
location = /sports/api/display { return 404; }
location = /watch/api/display { return 404; }
location = /library/api/display { return 404; }
location = /notify/api/display { return 404; }
location = /notifications/api/display { return 404; }
location = /files/api/display { return 404; }

# Notify's unsigned loopback endpoints: event ingest (stonepi_contracts.emit_event) and the
# Dashboard automations' TRMNL push. Apps call 127.0.0.1:8012 directly, never through nginx.
location = /notify/api/events { return 404; }
location = /notify/api/push-trmnl { return 404; }

# Signed service-to-service APIs (e.g. Auth /api/internal/people for Notify)
# are loopback-only: never reachable through nginx, whatever the exposure.
location ~ ^/(?:[^/]+/)?api/internal(?:/|$) { return 404; }
