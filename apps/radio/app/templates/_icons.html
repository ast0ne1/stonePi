{% macro icon(name) -%}
<svg viewBox="0 0 24 24" aria-hidden="true">
{%- if name == 'home' -%}
<path d="M4 11.5 12 4l8 7.5"/><path d="M7 10.5V20h10v-9.5"/>
{%- elif name == 'listen' or name == 'radio' -%}
<path d="M5 15a7 7 0 0 1 14 0"/><path d="M8 15a4 4 0 0 1 8 0"/><circle cx="12" cy="17" r="1.5" fill="currentColor" stroke="none"/>
{%- elif name == 'now' -%}
<path d="M5 18v-5M9.5 18V7M14 18v-8M18.5 18V4.5"/>
{%- elif name == 'star' -%}
<path d="M12 3.5 14.5 9l6 .5-4.5 4 1.5 5.5L12 16l-5.5 3 1.5-5.5L3.5 9.5 9.5 9z" fill="currentColor" stroke="none"/>

<path d="M12 3.5 14.5 9l6 .5-4.5 4 1.5 5.5L12 16l-5.5 3 1.5-5.5L3.5 9.5 9.5 9z"/>
{%- elif name == 'search' -%}
<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>
{%- elif name == 'settings' -%}
<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
{%- elif name == 'about' -%}
<circle cx="12" cy="12" r="8"/><path d="M12 11.2V17"/><circle cx="12" cy="8" r="0.7" fill="currentColor" stroke="none"/>
{%- elif name == 'general' or name == 'device' -%}
<path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15.5" cy="8" r="2"/><circle cx="8.5" cy="16" r="2"/>
{%- elif name == 'sources' -%}
<path d="M4 7h16M4 12h16M4 17h10"/>
{%- elif name == 'check' -%}
<path d="m5 12 5 5L20 7"/>
{%- elif name == 'plus' -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == 'trash' -%}
<path d="M4.5 7h15M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M6.5 7l1 12a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-12M10 11v6M14 11v6"/>
{%- elif name == 'clear' -%}
<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'play' -%}
<path d="M8 6.5v11l10-5.5z" fill="currentColor" stroke="none"/>
{%- elif name == 'pause' -%}
<rect x="7" y="6" width="3.5" height="12" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="6" width="3.5" height="12" rx="1" fill="currentColor" stroke="none"/>
{%- elif name == 'stop' -%}
<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/>
{%- elif name == 'speaker' -%}
<rect x="6" y="3" width="12" height="18" rx="2.5"/><circle cx="12" cy="14" r="3.2"/><circle cx="12" cy="7.2" r="1" fill="currentColor" stroke="none"/>
{%- elif name == 'devices' -%}
<rect x="2" y="5" width="12.5" height="9" rx="1.5"/><path d="M1 17.5h15"/><rect x="17" y="8" width="6" height="12" rx="1.5"/><path d="M19.3 17.6h1.4"/>
{%- elif name == 'stonepi' -%}
{#- The StonePi mark's three slanted bars (logos/stonepi-mark-flat-*.svg), one colour. -#}
<path fill="currentColor" stroke="none" d="M3.4 6.9 20.6 0v3.4L6.9 8.9v2L3.4 12.3zM3.4 13.7l17.2-6.9v3.5L3.4 17.1zM20.6 17.1 3.4 24v-3.4l13.7-5.5v-2l3.5-1.4z"/>
{%- elif name == 'refresh' -%}
<path d="M19 8a7.5 7.5 0 1 0 .8 6"/><path d="M19.5 3.5V8H15"/>
{%- elif name == 'discover' -%}
<circle cx="12" cy="12" r="8.5"/><path d="m15.2 8.8-1.9 4.5-4.5 1.9 1.9-4.5z"/>
{%- elif name == 'volume-down' -%}
<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>
{%- elif name == 'volume-up' -%}
<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/>
{%- elif name == 'notifications' -%}
<path d="M6 16h12l-1.2-2V10a4.8 4.8 0 1 0-9.6 0v4L6 16z"/><path d="M10 18a2 2 0 0 0 4 0"/>
{%- else -%}
<circle cx="12" cy="12" r="7"/>
{%- endif -%}
</svg>
{%- endmacro %}

{#- Discover's genre glyphs (chips and the genre sheet), outline style like NewsCast's
    filter_icon; an unknown tag gets a music note. -#}
{% macro genre_icon(tag) -%}
<svg viewBox="0 0 24 24" aria-hidden="true">
{%- if tag == 'pop' -%}
<path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 16.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>
{%- elif tag == 'rock' -%}
<path d="M13 3 6 13.5h5L10 21l7.5-11H12.5z"/>
{%- elif tag == 'jazz' -%}
<path d="M9 18V6.5l10-2.5v11.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/>
{%- elif tag == 'electronic' -%}
<path d="M3 12h3l2-5 3 10 3-12 2.5 7H21"/>
{%- elif tag == 'classical' -%}
<path d="M12 3v14"/><path d="M12 3c3 1 4 3.5 2.5 6S9 12 9 15a3 3 0 0 0 6 0"/><circle cx="12" cy="19.5" r="1.3"/>
{%- elif tag == 'news' -%}
<path d="M5 6h11a2 2 0 0 1 2 2v11H7a2 2 0 0 1-2-2V6z"/><path d="M9 10h6M9 13h6M9 16h4"/>
{%- elif tag == 'talk' -%}
<path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-4 3.5v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/><path d="M8 10h8M8 13h5"/>
{%- elif tag == 'indie' -%}
<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="0.6" fill="currentColor" stroke="none"/>
{%- elif tag == 'chillout' -%}
<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>
{%- elif tag == 'hiphop' -%}
<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/>

<circle cx="12" cy="12" r="7"/><path d="M5 12h14M12 5a10 10 0 0 1 0 14M12 5a10 10 0 0 0 0 14M6.5 8h11M6.5 16h11"/>

<path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1.5A4.5 4.5 0 0 1 17 18z"/>
{%- elif tag == 'folk' -%}
<path d="M14.5 3.5l6 6M17.5 6.5l-6.5 6.5"/><circle cx="8.5" cy="15.5" r="5"/><circle cx="8.5" cy="15.5" r="1.4"/>
{%- elif tag == 'country' -%}
<circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>

<path d="M12 3.5c3.5 4.5 6 7.6 6 10.5a6 6 0 0 1-12 0c0-2.9 2.5-6 6-10.5z"/>
{%- elif tag == 'soul' -%}
<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10C19.5 15.4 12 20 12 20z"/>

<path d="M12 3l2 5.5h5.5l-4.5 3.5 1.7 5.5L12 14.2 7.3 17.5 9 12 4.5 8.5H10z"/>

<rect x="3.5" y="6.5" width="17" height="11" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/><path d="M8.5 14h7"/>
{%- elif tag == 'kids' -%}
<path d="M12 3.5a5 5 0 0 1 5 5c0 3.5-3 6.5-5 6.5s-5-3-5-6.5a5 5 0 0 1 5-5z"/><path d="M12 15l-1 2h2zM12 17c0 1.5-1.5 2.2-1.5 3.5"/>

<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
{%- elif tag == 'for-you' -%}
<circle cx="12" cy="12" r="8.5"/><path d="m15.2 8.8-1.9 4.5-4.5 1.9 1.9-4.5z"/>
{%- else -%}
<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
{%- endif -%}
</svg>
{%- endmacro %}
