<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee4" data-theme-color />
    <title>Sign in · EventTrakr</title>
    <script>
      (function () {
        function readPref(shared, legacy, fallback) {
          var value = localStorage.getItem(shared);
          if (value) return value;
          for (var i = 0; i < legacy.length; i++) {
            value = localStorage.getItem(legacy[i]);
            if (value) {
              localStorage.setItem(shared, value);
              return value;
            }
          }
          return fallback;
        }
        var pref = readPref("stonepi-theme", ["newscast-theme", "fileserve-theme", "eventtrakr-theme"], "system");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = pref === "system" ? (dark ? "dark" : "light") : pref;
        var palette = readPref("stonepi-palette", ["newscast-palette", "fileserve-palette", "eventtrakr-palette"], "default");
        if (!/^(default|ocean|forest|slate)$/.test(palette)) palette = "default";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePref = pref;
        document.documentElement.dataset.palette = palette;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/app.css?v={{ app_css_version }}" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <header class="login-top">
        <p class="brand">{% include "_brand_mark.html" %}EventTrakr</p>
      </header>
      <main class="card login-card">
        <h1>Sign in</h1>
        <p class="lede">Sign in to your event tracker.</p>
        {% if error %}
        <p class="banner">{{ error }}</p>
        {% endif %}
        {% if using_factory_admin %}
        <p class="banner banner-muted">Factory login is still <strong>admin / admin</strong>.</p>
        {% endif %}
        <form method="post" action="/login?next={{ next }}" class="stack">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <label>
            Username
            <input type="text" name="username" required autofocus autocomplete="username" />
          </label>
          <label>
            Password
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
      </main>
    </div>
  </body>
</html>
