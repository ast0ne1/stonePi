# Optional TLS termination on the Pi (Let's Encrypt or mounted certs).
# Install alongside stonepi.conf when certificates exist, e.g.:
#   sudo ln -s /etc/nginx/sites-available/stonepi-tls.conf /etc/nginx/sites-enabled/
# Cert paths default to certbot layout for stonepi.local — adjust as needed.
#
# When using Cloudflare Tunnel / Tailscale, TLS often terminates at the edge;
# keep the HTTP server and flip Dashboard → Settings → General → Internet-facing.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

map $request_uri $stonepi_expires {
    default                                     off;
    ~^/assets/fonts/.*\?v=                      7d;
    ~^/assets/fonts/                            7d;
    ~^/([a-z]+/)?(static|favicons)/.*\?v=       7d;
    ~^/([a-z]+/)?(static|favicons)/             1h;
}

map "$realip_remote_addr|$http_x_forwarded_proto|$host" $stonepi_forwarded_proto {
    default                                     $scheme;
    ~*^127\.0\.0\.1\|https\|                    https;
    ~*^::1\|https\|                             https;
    ~*^127\.0\.0\.1\|[^|]*\|.*\.ts\.net$        https;
    ~*^::1\|[^|]*\|.*\.ts\.net$                 https;
}

upstream stonepi_dashboard {
    server 127.0.0.1:8010;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_auth {
    server 127.0.0.1:8011;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_newscast {
    server 127.0.0.1:8001;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_fileserve {
    server 127.0.0.1:8002;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_eventtrakr {
    server 127.0.0.1:8003;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_pinboard {
    server 127.0.0.1:8004;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_studio {
    server 127.0.0.1:8005;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_pricescout {
    server 127.0.0.1:8006;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_sportguide {
    server 127.0.0.1:8007;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_pricewatch {
    server 127.0.0.1:8008;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_notify {
    server 127.0.0.1:8012;
    keepalive 8;
    keepalive_timeout 10s;
}
upstream stonepi_recover {
    server 127.0.0.1:8099;
    keepalive 1;
    keepalive_timeout 10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stonepi.local _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name stonepi.local _;

    ssl_certificate     /etc/letsencrypt/live/stonepi.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stonepi.local/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    absolute_redirect off;
    client_max_body_size 64m;
    client_body_buffer_size 1m;
    server_tokens off;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml font/woff2;

    expires $stonepi_expires;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header X-Frame-Options SAMEORIGIN;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;

    include /opt/stonepi/deploy/nginx/stonepi-public-deny-display.conf;

    location ^~ /assets/fonts/ {
        alias /opt/stonepi/packages/stonepi_brand/fonts/;
        access_log off;
        expires $stonepi_expires;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /static/ {
        alias /opt/stonepi/apps/dashboard/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /auth/static/ {
        alias /opt/stonepi/apps/auth/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /news/static/ {
        alias /opt/stonepi/apps/newscast/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /files/static/ {
        alias /opt/stonepi/apps/fileserve/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /events/static/ {
        alias /opt/stonepi/apps/eventtrakr/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /pinboard/static/ {
        alias /opt/stonepi/apps/pinboard/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /studio/static/ {
        alias /opt/stonepi/apps/studio/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /prices/static/ {
        alias /opt/stonepi/apps/pricescout/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /sports/static/ {
        alias /opt/stonepi/apps/sportguide/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /watch/static/ {
        alias /opt/stonepi/apps/pricewatch/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /notify/static/ {
        alias /opt/stonepi/apps/notify/app/static/;
        access_log off;
        expires $stonepi_expires;
    }
    location ^~ /recover/static/ {
        alias /opt/stonepi/apps/recover/app/static/;
        access_log off;
        expires $stonepi_expires;
    }

    location /auth/ {
        proxy_pass http://stonepi_auth/;
    }
    location /news/ {
        proxy_pass http://stonepi_newscast/;
    }
    location /files/ {
        proxy_pass http://stonepi_fileserve/;
    }
    location /events/ {
        proxy_pass http://stonepi_eventtrakr/;
    }
    location /pinboard/ {
        proxy_pass http://stonepi_pinboard/;
    }
    location /studio/ {
        proxy_pass http://stonepi_studio/;
    }
    location /prices/ {
        proxy_pass http://stonepi_pricescout/;
    }
    location /sports/ {
        proxy_pass http://stonepi_sportguide/;
    }
    location /watch/ {
        proxy_pass http://stonepi_pricewatch/;
    }
    location /notify/ {
        proxy_pass http://stonepi_notify/;
    }
    location /recover/ {
        proxy_pass http://stonepi_recover/;
    }
    # Pre-rename paths (Notifications -> Notify, Recovery -> Recover). 308 keeps method + body.
    # /notifications (no slash) is the Dashboard's personal-alerts page; only the old
    # app's /notifications/... paths redirect to Notify.
    location ~ ^/notifications/(?<legacy_notify_path>.*)$ { return 308 /notify/$legacy_notify_path$is_args$args; }
    location = /recovery { return 308 /recover/$is_args$args; }
    location ~ ^/recovery/(?<legacy_recover_path>.*)$ { return 308 /recover/$legacy_recover_path$is_args$args; }
    location / {
        proxy_pass http://stonepi_dashboard;
    }
}
