<!doctype html>
<html lang="en" data-stonepi-prefix="{{ stonepi_prefix or '' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee4" data-theme-color />
    <title>Sign in · EventTrakr</title>
    {% include "_theme_boot.html" %}
    <link rel="stylesheet" href="/assets/fonts/fonts.css?v={{ fonts_rev }}" />
    <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}-{{ asset_rev }}" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <header class="login-top">
        <p class="brand">{% include "_brand_mark.html" %}EventTrakr</p>
      </header>
      <main class="card login-card">
        <h1>Sign in</h1>
        <p class="lede">Sign in to your event tracker.</p>
        {% if error %}
        <p class="banner">{{ error }}</p>
        {% endif %}
        {% if using_factory_admin %}
        <p class="banner banner-muted">Factory login is still <strong>admin / admin</strong>.</p>
        {% endif %}
        <form method="post" action="/login?next={{ next }}" class="stack">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <label>
            Username
            <input type="text" name="username" required autofocus autocomplete="username" />
          </label>
          <label>
            Password
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
      </main>
    </div>
  </body>
</html>
