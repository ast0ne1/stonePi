<!doctype html>
<html lang="en" data-stonepi-prefix="{{ stonepi_prefix or '' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe4" data-theme-color />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{ homescreen_name or 'FileServe' }}" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.svg') }}" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sign in · FileServe</title>
    {% include "_theme_boot.html" %}
    <link rel="stylesheet" href="/assets/fonts/fonts.css?v={{ fonts_rev }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ asset_rev }}" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <header class="login-top">
        <p class="brand">{% include "_brand_mark.html" %}FileServe</p>
      </header>
      <main class="card login-card">
        <h1>Sign in</h1>
        <p class="lede">Use your FileServe username and password.</p>
        {% if error %}
        <p class="banner">{{ error }}</p>
        {% endif %}
        {% if using_factory_admin %}
        <p class="banner banner-muted">Factory login is still <strong>admin / admin</strong>.</p>
        {% endif %}
        <form method="post" action="{{ url_for('login') }}" class="stack" data-native autocomplete="on">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="next" value="{{ next }}" />
          <label>
            Username
            <input type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_rev }}" defer></script>
  </body>
</html>
