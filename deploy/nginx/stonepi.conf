map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream stonepi_dashboard { server 127.0.0.1:8010; }
upstream stonepi_auth      { server 127.0.0.1:8011; }
upstream stonepi_newscast  { server 127.0.0.1:8001; }
upstream stonepi_fileserve { server 127.0.0.1:8002; }
upstream stonepi_eventtrakr { server 127.0.0.1:8003; }
upstream stonepi_pinboard  { server 127.0.0.1:8004; }
upstream stonepi_studio    { server 127.0.0.1:8005; }
upstream stonepi_pricescout { server 127.0.0.1:8006; }
upstream stonepi_sportguide { server 127.0.0.1:8007; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stonepi.local *.ts.net _;

    client_max_body_size 64m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header X-Frame-Options SAMEORIGIN;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Prefer single hop from nginx; apps trust X-Real-IP for rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;

    # Display JSON is scraped by Dashboard over loopback; never expose at the edge.
    include /opt/stonepi/deploy/nginx/stonepi-public-deny-display.conf;

    location /auth/ {
        proxy_pass http://stonepi_auth/;
    }
    location /news/ {
        proxy_pass http://stonepi_newscast/;
    }
    location /files/ {
        proxy_pass http://stonepi_fileserve/;
    }
    location /events/ {
        proxy_pass http://stonepi_eventtrakr/;
    }
    location /pinboard/ {
        proxy_pass http://stonepi_pinboard/;
    }
    location /studio/ {
        proxy_pass http://stonepi_studio/;
    }
    location /prices/ {
        proxy_pass http://stonepi_pricescout/;
    }
    location /sports/ {
        proxy_pass http://stonepi_sportguide/;
    }
    location / {
        proxy_pass http://stonepi_dashboard;
    }
}
