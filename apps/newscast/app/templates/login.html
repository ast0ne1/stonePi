<!doctype html>
<html lang="{{ ui_lang or 'en' }}" data-stonepi-prefix="{{ stonepi_prefix or '' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe4" data-theme-color />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{ homescreen_name or 'NewsCast' }}" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>{{ t("Sign in") }} · NewsCast</title>
    {% include "_theme_boot.html" %}
    <link rel="stylesheet" href="/assets/fonts/fonts.css?v={{ fonts_rev }}" />
    <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}-{{ asset_rev }}" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <header class="login-top">
        <p class="brand">{% include "_brand_mark.html" %}NewsCast</p>
      </header>
      <main class="card login-card">
        <h1>{{ t("Sign in") }}</h1>
        <p class="lede">{{ t("Use your NewsCast admin username and password.") }}</p>
        {% if error %}
        <p class="banner">{{ error }}</p>
        {% endif %}
        {% if using_factory_admin %}
        <p class="banner banner-muted">{{ t("Factory login is still admin / admin.") }}</p>
        {% endif %}
        <form method="post" action="/login" class="stack" data-native autocomplete="on">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="next" value="{{ next }}" />
          <label>
            {{ t("Username") }}
            <input type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
          </label>
          <label>
            {{ t("Password") }}
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary btn-block" type="submit">{{ t("Sign in") }}</button>
        </form>
      </main>
    </div>
    <script>window.NEWSCAST_I18N = {{ i18n_js|tojson }};</script>
    <script src="/static/js/app.js?v={{ app_version }}-{{ asset_rev }}" defer></script>
  </body>
</html>
