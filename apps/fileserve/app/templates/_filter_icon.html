{# Nav / chip / settings-heading icons. Usage: {% from "_filter_icon.html" import filter_icon %}{{ filter_icon("device") }} #}
{% macro filter_icon(name) -%}
<svg viewBox="0 0 24 24" aria-hidden="true">
  {%- if name == "device" -%}
  <path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15.5" cy="8" r="2" fill="currentColor" stroke="none"/><circle cx="8.5" cy="16" r="2" fill="currentColor" stroke="none"/>
  {%- elif name == "access" -%}
  <rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
  {%- elif name == "network" -%}
  <rect x="3.5" y="5.5" width="17" height="12" rx="2"/><path d="M8 20h8M12 17.5V20"/>
  {%- elif name == "backup" -%}
  <path d="M12 5v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/>
  {%- elif name == "update" -%}
  <path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 5v5h-5"/>
  {%- elif name == "users" -%}
  <circle cx="9" cy="8" r="3"/><path d="M3.5 18.5c.8-3 2.8-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/><circle cx="17" cy="9" r="2.4"/><path d="M14.2 18.5c.5-2.2 1.8-3.4 3.8-3.4 1.2 0 2.2.4 2.9 1.2"/>
  {%- elif name == "add-user" -%}
  <circle cx="10" cy="8" r="3"/><path d="M4 19c1-3 3.1-4.6 6-4.6 1.4 0 2.6.4 3.6 1.1"/><path d="M18 13v6M15 16h6"/>
  {%- elif name == "file" -%}
  <path d="M8 4h6l4 4v12H8z"/><path d="M14 4v4h4"/>
  {%- elif name == "link" -%}
  <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>
  {%- elif name == "about" or name == "info" -%}
  <circle cx="12" cy="12" r="8"/><path d="M12 11.2V17"/><circle cx="12" cy="8" r="1.1" fill="currentColor" stroke="none"/>
  {%- elif name == "notifications" -%}
  <path d="M6 9a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>
  {%- else -%}
  <circle cx="12" cy="12" r="7"/>
  {%- endif -%}
</svg>
{%- endmacro %}
