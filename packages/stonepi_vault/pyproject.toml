[project]
name = "stonepi-vault"
version = "0.1.0"
description = "StonePi Vault: encrypted platform secrets and config store"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stonepi_vault*"]
