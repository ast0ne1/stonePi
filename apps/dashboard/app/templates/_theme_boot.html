<script>
  (function () {
    function readCookie(name) {
      var m = document.cookie.match(
        new RegExp("(?:^|; )" + name.replace(/([.$?*|{}()[\]\\/+^])/g, "\\$1") + "=([^;]*)")
      );
      return m ? decodeURIComponent(m[1]) : null;
    }
    function writeCookie(name, value) {
      document.cookie =
        name + "=" + encodeURIComponent(value) + "; Path=/; SameSite=Lax; Max-Age=31536000";
    }
    function readPref(shared, legacy, fallback) {
      var value = readCookie(shared) || localStorage.getItem(shared);
      if (!value) {
        for (var i = 0; i < legacy.length; i++) {
          value = readCookie(legacy[i]) || localStorage.getItem(legacy[i]);
          if (value) break;
        }
      }
      if (value) {
        try {
          localStorage.setItem(shared, value);
        } catch (e) {}
        writeCookie(shared, value);
        return value;
      }
      return fallback;
    }
    function readView(key, allowed, fallback) {
      var value = readCookie(key) || localStorage.getItem(key) || fallback;
      if (allowed.indexOf(value) < 0) value = fallback;
      try {
        localStorage.setItem(key, value);
      } catch (e) {}
      writeCookie(key, value);
      return value;
    }
    var pref = readPref("stonepi-theme", ["newscast-theme", "fileserve-theme", "eventtrakr-theme"], "system");
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = pref === "system" ? (dark ? "dark" : "light") : pref;
    var palette = readPref(
      "stonepi-palette",
      ["newscast-palette", "fileserve-palette", "eventtrakr-palette"],
      "default"
    );
    if (!/^(default|ocean|forest|slate)$/.test(palette)) palette = "default";
    try {
      localStorage.setItem("stonepi-palette", palette);
      localStorage.setItem("stonepi-theme", pref);
    } catch (e) {}
    writeCookie("stonepi-palette", palette);
    writeCookie("stonepi-theme", pref);
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.themePref = pref;
    document.documentElement.dataset.palette = palette;
    document.documentElement.style.colorScheme = theme;

    document.documentElement.dataset.viewHome = readView(
      "stonepi-view-home",
      ["cards", "list", "icons"],
      "cards"
    );
    document.documentElement.dataset.viewHealth = readView(
      "stonepi-view-health",
      ["full", "expandable", "compact"],
      "full"
    );
    document.documentElement.dataset.viewHealthVersion = readView(
      "stonepi-view-health-version",
      ["1", "0"],
      "1"
    );
    document.documentElement.dataset.viewHealthUrl = readView(
      "stonepi-view-health-url",
      ["1", "0"],
      "1"
    );
    document.documentElement.dataset.viewServices = readView(
      "stonepi-view-services",
      ["full", "expandable", "compact"],
      "full"
    );
    document.documentElement.dataset.viewServicesRoute = readView(
      "stonepi-view-services-route",
      ["1", "0"],
      "1"
    );
    document.documentElement.dataset.viewServicesPort = readView(
      "stonepi-view-services-port",
      ["1", "0"],
      "1"
    );
  })();
</script>
