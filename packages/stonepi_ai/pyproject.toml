[project]
name = "stonepi-ai"
version = "0.1.0"
description = "StonePi AI: platform AI providers, model tiers, falling over and shared health"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stonepi_ai*"]
