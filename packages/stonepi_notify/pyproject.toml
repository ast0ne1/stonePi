[project]
name = "stonepi-notify"
version = "0.1.0"
description = "StonePi Notify: ntfy delivery, personal alerts, event ingest, approvals, history, destinations"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stonepi_notify*"]
