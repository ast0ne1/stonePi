[project]
name = "stonepi-contracts"
version = "0.1.0"
description = "StonePi shared event/widget/destination contracts and emit_event client"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stonepi_contracts*"]
