[project]
name = "stonepi-update"
version = "0.1.0"
description = "Shared GitHub Releases updater for StonePi monorepo apps"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stonepi_update*"]
