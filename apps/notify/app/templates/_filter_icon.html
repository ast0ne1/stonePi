{# Nav, chip, settings, and section-heading icons (NewsCast pattern). #}
{% macro filter_icon(name) -%}
<svg viewBox="0 0 24 24" aria-hidden="true">
  {%- if name == "home" -%}
  <path d="M4 11.5 12 4l8 7.5"/><path d="M7 10.5V19h10v-8.5"/>
  {%- elif name == "displays" or name == "network" or name == "display" -%}
  <rect x="3.5" y="5.5" width="17" height="12" rx="2"/><path d="M8 20h8M12 17.5V20"/>
  {%- elif name == "bell" or name == "prefs" -%}
  <path d="M12 4a5 5 0 0 1 5 5v2.2l1.4 2.8H5.6L7 11.2V9a5 5 0 0 1 5-5z"/><path d="M10 18a2 2 0 0 0 4 0"/>
  {%- elif name == "history" -%}
  <circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/>
  {%- elif name == "settings" -%}
  <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  {%- elif name == "notifications" -%}
  <path d="M12 4a5 5 0 0 1 5 5v2.2l1.4 2.8H5.6L7 11.2V9a5 5 0 0 1 5-5z"/><path d="M10 18a2 2 0 0 0 4 0"/>
  {%- elif name == "about" or name == "info" -%}
  <circle cx="12" cy="12" r="8"/><path d="M12 11.2V17"/><circle cx="12" cy="8" r="1.1" fill="currentColor" stroke="none"/>
  {%- elif name == "outputs" or name == "send" -%}
  <path d="M12 16V5"/><path d="M8 9l4-4 4 4"/><path d="M5 19h14"/>
  {%- elif name == "widgets" or name == "catalog" -%}
  <path d="M6 4.5h9.5A2.5 2.5 0 0 1 18 7v12.5H8A2.5 2.5 0 0 1 5.5 17V6.5"/><path d="M8 8.5h7M8 12h7M8 15.5h5"/>
  {%- elif name == "sliders" or name == "general" -%}
  <path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.2" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="2.2" fill="currentColor" stroke="none"/>
  {%- elif name == "chevron" -%}
  <path d="m9 6 6 6-6 6"/>
  {%- else -%}
  <circle cx="12" cy="12" r="7"/>
  {%- endif -%}
</svg>
{%- endmacro %}

{% macro filter_chip(key, label, active=false) -%}
<button class="chip-btn{% if active %} is-active{% endif %}" type="button" data-filter="{{ key }}">{{ filter_icon(key) }}<span>{{ label }}</span></button>
{%- endmacro %}
