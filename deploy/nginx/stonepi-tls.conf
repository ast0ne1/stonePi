# Optional TLS termination on the Pi (Let's Encrypt or mounted certs).
# Install alongside stonepi.conf when certificates exist, e.g.:
#   sudo ln -s /etc/nginx/sites-available/stonepi-tls.conf /etc/nginx/sites-enabled/
# Cert paths default to certbot layout for stonepi.local — adjust as needed.
#
# When using Cloudflare Tunnel / Tailscale, TLS often terminates at the edge;
# keep the HTTP server and flip Dashboard → Settings → General → Internet-facing.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream stonepi_dashboard { server 127.0.0.1:8010; }
upstream stonepi_auth      { server 127.0.0.1:8011; }
upstream stonepi_newscast  { server 127.0.0.1:8001; }
upstream stonepi_fileserve { server 127.0.0.1:8002; }
upstream stonepi_eventtrakr { server 127.0.0.1:8003; }
upstream stonepi_pinboard  { server 127.0.0.1:8004; }
upstream stonepi_studio    { server 127.0.0.1:8005; }
upstream stonepi_pricescout { server 127.0.0.1:8006; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stonepi.local _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name stonepi.local _;

    ssl_certificate     /etc/letsencrypt/live/stonepi.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stonepi.local/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 64m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header X-Frame-Options SAMEORIGIN;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;

    include /opt/stonepi/deploy/nginx/stonepi-public-deny-display.conf;

    location /auth/ {
        proxy_pass http://stonepi_auth/;
    }
    location /news/ {
        proxy_pass http://stonepi_newscast/;
    }
    location /files/ {
        proxy_pass http://stonepi_fileserve/;
    }
    location /events/ {
        proxy_pass http://stonepi_eventtrakr/;
    }
    location /pinboard/ {
        proxy_pass http://stonepi_pinboard/;
    }
    location /studio/ {
        proxy_pass http://stonepi_studio/;
    }
    location /prices/ {
        proxy_pass http://stonepi_pricescout/;
    }
    location / {
        proxy_pass http://stonepi_dashboard;
    }
}
