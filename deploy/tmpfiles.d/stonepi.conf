# Persist shared Chromium lock directory across reboots
d /run/stonepi 1777 root root -
# Pre-create the lock owned by root (dir owner) so every app's service user can open it
# under fs.protected_regular; see packages/stonepi_browser/stonepi_browser/lock.py.
f /run/stonepi/chromium.lock 0666 root root -
